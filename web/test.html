<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>HOTLINE H5 · 波次生存冒烟测试</title>
<style>
  body { background:#111; color:#ddd; font-family: Consolas, monospace; margin:0; padding:16px; }
  canvas { position: fixed; left: -9999px; top: 0; }
  pre { font-size: 14px; line-height: 1.6; }
  .ok { color:#7fdc9a; } .fail { color:#ff6b6b; }
</style>
</head>
<body>
<canvas id="game" width="640" height="360"></canvas>
<pre id="result">running…</pre>
<script src="js/sfx_samples.js"></script>
<script src="js/game.js"></script>
<script>
(function () {
  const lines = [];
  function check(label, ok) {
    lines.push((ok ? '[OK]   ' : '[FAIL] ') + label);
    return ok;
  }
  function report() {
    const fails = lines.filter(l => l.startsWith('[FAIL]')).length;
    const summary = fails === 0 ? '全部通过' : fails + ' 项失败';
    const text = lines.join('\n') + '\n\n==== 冒烟测试结果：' + summary + ' ====';
    const el = document.getElementById('result');
    el.textContent = text;
    el.className = fails === 0 ? 'ok' : 'fail';
    document.title = 'RESULT:' + summary;
    window.__testDone = true;
    window.__testReport = text;
  }

  function waitReady(cb) {
    if (window.__ready) return cb();
    setTimeout(() => waitReady(cb), 50);
  }

  waitReady(() => {
    try {
      runTests();
    } catch (e) {
      document.getElementById('result').textContent = '测试异常: ' + e.message + '\n' + e.stack;
      document.title = 'RESULT:异常';
    }
  });

  function runTests() {
    const H = window.HOTLINE;
    H.freeze(true);

    // ============ 1. 游戏启动 ============
    H.startGame();
    const w = H.world, g = H.g, p = g.player;
    check('单张防守地图加载（' + w.title + '）', !!w && w.w > 0 && w.h > 0);
    check('刷怪点存在（' + w.spawnPoints.length + ' 个）', w.spawnPoints.length >= 4);
    check('补给点存在（' + (w.supplies ? w.supplies.length : 0) + ' 个）', w.supplies && w.supplies.length >= 1);
    check('玩家出生点可站（非墙内）', !isInWall(w, p.x, p.y));
    check('开局发手枪 + 满备弹', p.weapon === 'pistol' && p.ammo === 8 && p.reserve === 64);
    check('第 1 波已生成（' + g.wave + ' 波）', g.wave === 1);

    // ============ 2. 单血量 + 护甲结构 ============
    check('玩家血量上限 100（当前 ' + p.hp + '）', p.hp === 100);
    check('初始无护甲（armor=' + p.armor + '）', p.armor === 0);

    // ============ 3. 护甲先扣，扣完掉血 ============
    H.refillArmor(p);
    check('补满护甲（初始 1 级单格 50，armor=' + p.armor + '）', p.armor === 50);
    const hpBefore = p.hp;
    H.hurt(30, 0);   // 30 伤害，护甲吸收，不掉血
    check('护甲吸收伤害（护甲 ' + p.armor + '，血量不变 ' + hpBefore + '）', p.armor === 20 && p.hp === hpBefore);
    // 打穿护甲
    p.armor = 10;
    const hp2 = p.hp;
    H.hurt(40, 0);   // 10 护甲吸收 + 30 掉血
    check('护甲耗尽后掉血（hp ' + hp2 + '→' + p.hp + '）', p.armor === 0 && p.hp === hp2 - 30);

    // ============ 4. 敌人血量大幅降低 ============
    const enemy = w.enemies[0];
    enemy.alive = true;
    const eHp0 = enemy.hp;
    check('敌人血量低（' + eHp0 + '，应 < 30）', eHp0 > 0 && eHp0 < 30);
    // 把敌人直接放到玩家正右方（避开掩体），手枪两枪（20×2）能打死近战敌人（hp 24）
    p.weapon = 'pistol'; p.ammo = 8; p.cooldown = 0;
    enemy.x = p.x + 40; enemy.y = p.y;
    p.facing = { x: 1, y: 0 };
    H.attack();
    for (let i = 0; i < 12; i++) H.step(1);   // 等冷却（0.15s）
    H.attack();
    check('手枪两枪打死近战敌人（hp ' + eHp0 + '→死）', !enemy.alive);
    check('击杀获得积分（cash=' + g.cash + '）', g.cash > 0);

    // ============ 5. 备弹系统：换弹从备弹取 ============
    w.pickups.length = 0;   // 清掉第 4 节可能掉落的弹药，否则换弹完成后会被自动吸掉、reserve 又补满
    p.weapon = 'pistol';
    p.ammo = 0; p.reserve = 64;
    p.reload = 0;
    const clips5 = H.fxClips.length;
    H.attack();  // 触发换弹
    check('空仓触发换弹（reload=' + p.reload + '）', p.reload > 0);
    check('空仓自动换弹也走同一套动画（clips +' + (H.fxClips.length - clips5) + '）',
      H.fxClips.length === clips5 + 1);
    check('换弹记下总时长，准心进度环要用（reloadTotal=' + p.reloadTotal + '）',
      p.reloadTotal > 0 && Math.abs(p.reloadTotal - p.reload) < 1e-6);
    // 手动推进换弹完成（清场，免得换弹这 0.9 秒里被小怪打死触发重开）
    for (let i = 0; i < 60; i++) { H.world.enemies.length = 0; H.step(1); }
    check('换弹后弹匣回满、备弹减少（ammo=' + p.ammo + '，reserve=' + p.reserve + '）', p.ammo === 8 && p.reserve === 56);
    check('换弹结束后 reloadTotal 归零（' + p.reloadTotal + '）', p.reloadTotal === 0);

    // ============ 6. 冲锋枪 ============
    p.weapon = 'smg';
    p.ammo = 20; p.reserve = 120;
    const smgDef = { fireRate: 0.07, auto: true, mag: 20, reserveMax: 120 };
    check('冲锋枪主弹匣 20 发（mag=' + smgDef.mag + '）', smgDef.mag === 20);
    check('冲锋枪备弹上限 120（reserveMax=' + smgDef.reserveMax + '）', smgDef.reserveMax === 120);
    check('冲锋枪全自动（auto=' + smgDef.auto + '）', smgDef.auto === true);
    check('冲锋枪射速快（fireRate=' + smgDef.fireRate + '）', smgDef.fireRate < 0.1);

    // ============ 7. 掉落系统 ============
    // 关键回归：手持武器时，走近血包也应自动拾取进背包（修复"按4拿不出血包"）
    const w7 = H.world;
    p.weapon = 'pistol'; p.medkits = 0; p.hp = 30;
    const med = { def: 'medkit', x: p.x + 10, y: p.y, bob: 0, vx: 0, vy: 0, flying: false, rot: 0 };
    w7.pickups.push(med);
    H.step(1);   // 走 updatePlayer → tryPickup(false) 自动拾取
    check('持枪时血包自动拾取进背包（medkits=' + p.medkits + '，hp=' + p.hp + '）', p.medkits === 1 && p.hp === 30);
    // 弹药掉落（持枪时也自动补备弹）
    const ammo = { def: 'ammo', x: p.x + 10, y: p.y, bob: 0, vx: 0, vy: 0, flying: false, rot: 0 };
    w7.pickups.push(ammo);
    p.weapon = 'pistol'; p.reserve = 0;
    H.step(1);
    check('持枪时弹药自动补备弹（reserve=' + p.reserve + '）', p.reserve > 0);

    // ============ 8. 补给点 ============
    H.startGame();
    const g8 = H.g, p8 = g8.player;
    // 把玩家挪到补给点旁边
    const supply = H.world.supplies[0];
    p8.x = supply.x + 20; p8.y = supply.y;
    check('走近补给点可识别（nearSupply）', H.nearSupply() !== null);
    // 远离补给点
    p8.x = H.world.spawn.x; p8.y = H.world.spawn.y;
    const nearAway = H.nearSupply();
    check('远离补给点不可开商店', nearAway === null || Math.hypot(p8.x - supply.x, p8.y - supply.y) > 40);

    // ============ 9. 商店无技能，有护甲/老虎机 ============
    p8.x = supply.x + 20; p8.y = supply.y;
    g8.cash = 1000;
    H.openShop();
    check('打开商店（state=' + g8.state + '）', g8.state === 'shop');
    const hasPerk = H.shop.some(s => s.kind === 'perk');
    check('商店不再出售技能（perk 项数=0）', !hasPerk);
    const hasArmor = H.shop.some(s => s.kind === 'armor');
    check('商店出售护甲板', hasArmor);
    const hasSlot = H.shop.some(s => s.kind === 'slot');
    check('商店有老虎机', hasSlot);
    // 买护甲板：进背包（不再立即补满）
    g8.shopSel = H.shop.findIndex(s => s.kind === 'armor');
    p8.armor = 0; p8.armorSlots = 0; p8.armorPlates = 0;
    H.buyShopItem();
    check('买护甲板进背包（armorPlates=' + p8.armorPlates + '，armor=' + p8.armor + '）', p8.armorPlates === 1 && p8.armor === 0);

    // ============ 10. 老虎机 ============
    // 直接验证结算逻辑：三个相同 → 发技能
    g8.slotState = { spinning: false, t: 2.0, stops: [0, 0, 0], result: null };
    // 模拟 updateSlot 结算分支：手动触发 grantSkill
    const pPerkBefore = p8.perks.speed;
    H.grantSkill(p8, 'speed');
    check('老虎机发技能（perks.speed=' + p8.perks.speed + '）', p8.perks.speed === pPerkBefore + 1);
    // 铁甲技能补满护甲（初始 1 级单格 50）
    p8.armor = 0;
    H.grantSkill(p8, 'armor');
    check('铁甲技能补满护甲（armor=' + p8.armor + '）', p8.armor === 50);
    // 三同判定逻辑：构造三个相同符号的 slot 并跑完动画
    const slot2 = H.startSlot();
    slot2.spinning = false;
    slot2.t = 2.0;
    slot2.stops = [1, 1, 1];   // firerate
    slot2.result = null;
    g8.slotState = slot2;
    // 直接验证结算分支（三个相同才发奖）
    const sym = slot2.spinning ? null :
      (slot2.stops[0] === slot2.stops[1] && slot2.stops[1] === slot2.stops[2] ? H.slotSymbols[slot2.stops[0]] : null);
    check('三同图案判定正确（' + sym + '）', sym === 'firerate');
    // 关闭商店不再进下一波（现在波次清空才自动进下一波）
    H.closeShop();
    check('关闭商店回到 play（state=' + g8.state + '）', g8.state === 'play');

    // ============ 9.5 商店点击购买 / 退出按钮 ============
    H.openShop();
    const sb = H.shopButtons();
    check('商店有「购买」「退出」按钮', !!sb.buy && !!sb.exit && sb.buy.w > 0 && sb.exit.w > 0);
    // 命中检测：左列第 0 行（手枪，col=0,row=0）与右列第 0 行（手雷，col=1,row=0 → idx=5）
    check('点击左列商品命中（idx=' + H.shopItemAt(20, 112) + '）', H.shopItemAt(20, 112) === 0);
    check('点击右列商品命中（idx=' + H.shopItemAt(340, 112) + '）', H.shopItemAt(340, 112) === 5);
    // 点商品行 → 选中
    H.tap(20, 112 + 3 * 46);   // 第 3 行 = 弹药（idx=3）
    check('点商品行选中（shopSel=' + g8.shopSel + '）', g8.shopSel === 3);
    // 点「购买」按钮 → 扣款并回血（血包）
    p8.hp = 1;
    g8.shopSel = H.shop.findIndex(s => s.kind === 'heal');
    const cashBefore = g8.cash;
    H.tap(sb.buy.x + sb.buy.w / 2, sb.buy.y + sb.buy.h / 2);
    check('点「购买」扣款并回血（cash ' + cashBefore + '→' + g8.cash + '，hp=' + p8.hp + '）', g8.cash < cashBefore && p8.hp > 1);
    // 点「退出」按钮 → 关闭商店
    H.tap(sb.exit.x + sb.exit.w / 2, sb.exit.y + sb.exit.h / 2);
    check('点「退出」关闭商店（state=' + g8.state + '）', g8.state === 'play');

    // ============ 10.5 开界面用的按键不能被状态切换反复读 ============
    // 真机上的坑：高刷屏里按下那一帧可能没跑到 update（advanced=false），
    // pressed 活到下一帧，被新状态的分支读成"再按一次"，于是商店开了就关、暂停闪一下就没了。
    H.startGame();
    const gOpen = H.g, pOpen = gOpen.player;
    const supOpen = H.world.supplies[0];
    pOpen.x = supOpen.x + 20; pOpen.y = supOpen.y;
    H.key('e', true);
    H.frameEnd(false);                     // 按下那帧没跑 update
    check('没跑 update 的帧里按 E 也能开商店（state=' + gOpen.state + '）', gOpen.state === 'shop');
    check('开店的 E 已被消费（残留=' + H.pendingKeys.join(',') + '）', H.pendingKeys.length === 0);
    H.frameEnd(true);                      // 下一帧
    check('下一帧商店仍然开着，不会被同一个 E 关掉', gOpen.state === 'shop');
    H.key('e', false); H.clearPressed();
    H.key('e', true); H.frameEnd(true);
    check('松手再按 E 才关商店（state=' + gOpen.state + '）', gOpen.state === 'play');
    H.key('e', false); H.clearPressed();

    H.key('escape', true);
    H.frameEnd(false);
    check('没跑 update 的帧里按 ESC 也能暂停', gOpen.paused === true);
    check('暂停用的 ESC 不残留（残留=' + H.pendingKeys.join(',') + '）', H.pendingKeys.length === 0);
    gOpen.paused = false;
    H.key('escape', false); H.clearPressed();

    pOpen.x = H.world.spawn.x; pOpen.y = H.world.spawn.y;
    H.key('e', true);
    H.frameEnd(false);
    check('远离交互物按 E 不开商店（state=' + gOpen.state + '）', gOpen.state === 'play');
    H.key('e', false); H.clearPressed();

    // ============ 10.6 暂停菜单：返回主菜单 ============
    H.startGame();
    const gPause = H.g;
    gPause.paused = true;
    gPause.pauseSel = 0;
    // ESC 继续游戏
    H.key('escape', true);
    H.handlePauseKeys();
    H.key('escape', false); H.clearPressed();
    check('暂停菜单按 ESC 继续（paused=' + gPause.paused + '）', gPause.paused === false);
    // 再暂停，选到「返回主菜单」（现在是第 3 项，需按两次 S）并确认
    gPause.paused = true; gPause.pauseSel = 0;
    H.key('s', true);
    H.handlePauseKeys();
    H.key('s', false); H.clearPressed();
    H.key('s', true);
    H.handlePauseKeys();
    H.key('s', false); H.clearPressed();
    check('按两次 S 选中「返回主菜单」（pauseSel=' + gPause.pauseSel + '）', gPause.pauseSel === 2);
    H.key('enter', true);
    H.handlePauseKeys();
    H.key('enter', false); H.clearPressed();
    check('确认后回到标题页（state=' + gPause.state + '，world=' + (H.world ? '存在' : '清空') + '）',
      gPause.state === 'title' && H.world === null);
    // 标题页能正常重新开局
    H.startGame();
    check('从标题页重新开局（state=' + H.g.state + '）', H.g.state === 'play');

    // ============ 10.7 暂停菜单：设置入口（进入设置后返回应回暂停，而非回标题） ============
    H.startGame();
    const gPauseSet = H.g;
    gPauseSet.paused = true;
    gPauseSet.pauseSel = 0;
    H.key('s', true);          // 选中「设置」（第 2 项）
    H.handlePauseKeys();
    H.key('s', false); H.clearPressed();
    check('按一次 S 选中「设置」（pauseSel=' + gPauseSet.pauseSel + '）', gPauseSet.pauseSel === 1);
    H.key('enter', true);
    H.handlePauseKeys();
    H.key('enter', false); H.clearPressed();
    check('确认进入设置页（state=' + gPauseSet.state + '）', gPauseSet.state === 'settings');
    check('设置页来源为暂停（settingsFrom=' + gPauseSet.settingsFrom + '）', gPauseSet.settingsFrom === 'pause');
    // 从设置返回 → 回到暂停（而非标题），世界仍在
    H.key('escape', true);
    H.frameEnd(true);
    H.key('escape', false); H.clearPressed();
    check('从设置返回回到暂停（state=' + gPauseSet.state + '，paused=' + gPauseSet.paused + '）',
      gPauseSet.state === 'play' && gPauseSet.paused === true);
    check('世界仍保留（world 存在）', H.world !== null);
    gPauseSet.paused = false;

    // ============ 11. 护甲板按 4 一次切出装配 ============
    H.startGame();
    const gA = H.g, pA = gA.player;
    pA.armorPlates = 1; pA.armorSlots = 0; pA.armor = 0;
    // 按 4 一次就取出护甲板 → 进入装配模式
    H.key('4', true);
    H.step(1);
    check('按4一次切出护甲板（plating=' + pA.plating + '）', pA.plating === true);
    H.clearPressed();
    // 长按左键 1 秒 → 装一块护甲（PLATE_TIME = 1.0）
    H.holdFire(true);
    for (let i = 0; i < 70; i++) { H.step(1); }
    check('长按1秒装一块护甲（armorPlates=0，armorSlots=1，armor=50）',
      pA.armorPlates === 0 && pA.armorSlots === 1 && pA.armor === 50);
    H.holdFire(false);
    // 护甲满时按 4 仍能切出来（不再拦住切换），只是读完不扣板
    pA.armorTier = 2; pA.armorPlates = 1; pA.armorSlots = 3; pA.armor = 150;
    H.key('4', true);
    H.step(1);
    check('护甲已满也能切出护甲板（plating=' + pA.plating + '）', pA.plating === true);
    H.clearPressed();
    H.holdFire(true);
    for (let i = 0; i < 70; i++) { H.step(1); }
    H.holdFire(false);
    check('护甲满时读完不浪费护甲板（armorPlates=' + pA.armorPlates + '）', pA.armorPlates === 1);
    H.clearPressed();

    // 被削掉一半的甲（3 格板还在，但只剩 60 点）必须还能补 —— 判满只看护甲值
    pA.armorTier = 2; pA.armorPlates = 1; pA.armorSlots = 3; pA.armor = 60;
    H.clearPressed();
    H.key('4', true); H.step(1); H.clearPressed();
    check('半甲按4仍能取出护甲板（plating=' + pA.plating + '）', pA.plating === true);
    H.holdFire(true);
    // 每帧清场：装甲这 1 秒里被小怪打掉几滴甲，断言就会飘（曾经偶发 100 而不是 110）
    for (let i = 0; i < 70; i++) { H.world.enemies.length = 0; H.step(1); }
    H.holdFire(false);
    check('半甲（60）补一块变 110、扣一块板（armor=' + pA.armor + '，armorPlates=' + pA.armorPlates + '）',
      pA.armor === 110 && pA.armorPlates === 0 && pA.armorSlots === 3);
    // 护甲值掉到 40 时格数应跟着变成 1（否则 HUD/判满又会错位）
    pA.armor = 100; H.hurt(60);
    check('受击后格数与护甲值同步（armor=' + pA.armor + '，armorSlots=' + pA.armorSlots + '）',
      pA.armor === 40 && pA.armorSlots === 1);
    H.clearPressed();

    // ============ 11b. 数字键直达：1 主武器 / 2 副武器 / 3 血包 ============
    H.startGame();
    const gK = H.g, pK = gK.player, wK = H.world;
    wK.pickups.length = 0;
    pK.medkits = 2; pK.hp = 40;
    // 3 一次切出血包
    H.key('3', true); H.step(1); H.clearPressed();
    check('按3一次切出血包（healing=' + pK.healing + '）', pK.healing === true);
    // 1 一次回主武器
    H.key('1', true); H.step(1); H.clearPressed();
    check('按1一次收回血包回主武器（healing=' + pK.healing + '，weapon=' + pK.weapon + '）',
      pK.healing === false && pK.weapon === 'pistol');
    // 手动捡一把霰弹枪进副槽
    H.dropGun('shotgun', pK.x + 8, pK.y);
    H.pickup();
    check('第二把枪进副槽（' + (pK.side && pK.side.weapon) + '）', !!pK.side && pK.side.weapon === 'shotgun');
    // 2 一次切副武器
    H.key('2', true); H.step(1); H.clearPressed();
    check('按2一次切副武器（weapon=' + pK.weapon + '）', pK.weapon === 'shotgun');
    // 等换枪动画走完（shotgun drawTime 0.46s），再按 1 切回
    for (let i = 0; i < 30; i++) H.step(1);
    // 1 一次回主武器

      H.getLayoutPos('fire').x === 100 && H.getLayoutPos('fire').y === 100);

    if (storyEnemies.length > 1) {

    }

    // 终点机制：剧情关卡有出口、清场后走到终点才结算
    check('剧情第一关有出口（exit=' + (wSt.exit ? wSt.exit.x + ',' + wSt.exit.y : 'null') + '）', !!wSt.exit);
    check('开局没有 GO BACK 提示（goBack=' + gSt.goBack + '）', !gSt.goBack);

    // 清空敌人 → 不应立即结算，而是进入「清场等出口」状态
    // （终点就是出生点，所以先把玩家挪进楼里，否则站在门口清完会直接判定为已返回）
    gSt.player.x = 15 * 24;
    gSt.player.y = 8 * 24;
    for (const e of wSt.enemies) H.hitEnemy(e, 9999);
    H.step(1);  // 推进一帧触发清场判定
    check('剧情清空后敌人全灭', wSt.enemies.every(e => !e.alive));
    check('清空后已清场标记（cleared=' + wSt.cleared + '）', wSt.cleared === true);
    check('清空后未立即结算（state=' + gSt.state + '，应仍为 play）', gSt.state === 'play');
    check('清场后弹出 GO BACK 提示（goBack=' + gSt.goBack.toFixed(2) + '）', gSt.goBack > 0);

    // 走到终点 → 进入评分结算
    if (wSt.exit) {
      gSt.player.x = wSt.exit.x;
      gSt.player.y = wSt.exit.y;
      H.step(1);
      check('走到终点后结算（state=' + gSt.state + '，应为 storyclear）', gSt.state === 'storyclear');
    }

    // 评分函数可用
    const grade = H.storyGrade ? H.storyGrade() : null;
    check('剧情评分函数可用（grade=' + grade + '）', grade !== null);

    // ============ 30.2 剧情：一击必杀 / 无备弹 / 门外出生成 / 扔枪 ============
    H.startGame({ mode: 'story' });
    const w2 = H.world, g2 = H.g;
    check('剧情出生点就是终点（迈阿密式原路返回）',
      !!w2.exit && Math.abs(w2.exit.x - w2.spawn.x) < 0.01 && Math.abs(w2.exit.y - w2.spawn.y) < 0.01);
    check('出生点在楼外街道（y=' + g2.player.y.toFixed(0) + '，需 > ' + (14 * 24) + '）', g2.player.y > 14 * 24);
    check('剧情手枪没有备弹（reserve=' + g2.player.reserve + '）', g2.player.reserve === 0);
    check('剧情满匣手枪（ammo=' + g2.player.ammo + '）', g2.player.ammo > 0);
    const e0s = w2.enemies[0];
    H.hitEnemy(e0s, 1);
    check('剧情敌人一击必杀（1 点伤害也打死）', e0s.alive === false);
    H.hurt(3);
    check('剧情模式一击必杀（hp=' + g2.player.hp + '，alive=' + g2.player.alive + '）', g2.player.alive === false);

    // 扔枪：手上这把飞出去 → 落地变成可捡的枪
    H.startGame({ mode: 'story' });
    const w3 = H.world, g3 = H.g;

    // 撞门：玩家不靠子弹也能把门推开/撞开（否则子弹打光就进不了楼）
    const dEnt = w3.doors[0];
    if (dEnt) {
      g3.player.x = dEnt.x;
      g3.player.y = dEnt.y + 16;
      H.step(1);
      check('玩家走到门口会自动撞开门（open=' + dEnt.open + '）', dEnt.open === true);
    }

    const pkBefore = w3.pickups.length;
    g3.player.facing = { x: 1, y: 0 };
    const threw = H.throwWeapon();
    check('剧情模式可以扔枪（thrown=' + H.thrown.length + '）', threw === true && H.thrown.length === 1);
    check('扔出去后手上空了（weapon=' + g3.player.weapon + '）', !g3.player.weapon);
    H.step(90);
    check('扔出的枪落地变成拾取物（' + pkBefore + ' → ' + w3.pickups.length + '）', w3.pickups.length > pkBefore);

    // ============ 30.3 难度：开枪前摇 / 精准度 / 会开门 / 不堵门 ============
    const EK = H.enemyKind;
    check('枪手有举枪前摇（windup=' + EK.gun.windup + 's）', EK.gun.windup >= 0.45);
    check('霰弹兵前摇更长（windup=' + EK.shotgun.windup + 's）', EK.shotgun.windup >= EK.gun.windup);
    check('近战也有前摇（windup=' + EK.melee.windup + 's）', EK.melee.windup >= 0.2);
    check('枪手精准度降低（aimErr=' + EK.gun.aimErr + '°）', EK.gun.aimErr >= 12);
    check('霰弹兵精准度降低（aimErr=' + EK.shotgun.aimErr + '°）', EK.shotgun.aimErr >= 15);
    check('距离越远越飘（170px ' + H.enemyAimErr(EK.gun, 170).toFixed(1) + '° > 40px '
      + H.enemyAimErr(EK.gun, 40).toFixed(1) + '°）',
      H.enemyAimErr(EK.gun, 170) > H.enemyAimErr(EK.gun, 40));

    // 前摇：把枪手摆在玩家正前方视线内，逼它进入攻击流程
    H.startGame({ mode: 'story' });
    const w4 = H.world, g4 = H.g;
    const shooter = w4.enemies.find(e => EK[e.kind].aimErr > 0);
    if (shooter) {
      const K4 = EK[shooter.kind];
      shooter.state = 'chase';
      shooter.attackCd = 0;
      shooter.wind = 0;
      shooter.x = g4.player.x + 70;
      shooter.y = g4.player.y;
      shooter.facing = Math.PI;          // 朝左，正对玩家
      H.step(12);                        // ≈0.2s：还在举枪，没开火
      check('敌人开枪前先举枪（wind=' + shooter.wind.toFixed(2) + 's / 前摇 ' + K4.windup + 's）',
        shooter.wind > 0 && shooter.wind < H.enemyWindup(K4));
      check('前摇没走完玩家还活着（state=' + g4.state + '）', g4.state === 'play');
    }

    // ============ 30.4 枪手站位性格（前压 / 后方架枪）+ 不打队友 ============
    const zzGR = H.gunRole;
    check('枪手分前压/架枪两种性格（push/hold 都在表里）', !!zzGR.push && !!zzGR.hold);
    check('前压比架枪贴得更近（' + Math.round(118 * zzGR.push.keep) + 'px < '
      + Math.round(118 * zzGR.hold.keep) + 'px）', zzGR.push.keep < zzGR.hold.keep);
    check('架枪的瞄得更准（误差系数 ' + zzGR.hold.err + ' < ' + zzGR.push.err + '）', zzGR.hold.err < zzGR.push.err);
    check('架枪到位会站定（settle=' + zzGR.hold.settle + '，前压不站定 settle=' + zzGR.push.settle + '）',
      zzGR.hold.settle === 1 && !zzGR.push.settle);
    const zzRoleBag = { push: 0, hold: 0, none: 0 };
    for (let i = 0; i < 40; i++) {
      const e = H.makeEnemy('gun', 0, 0);
      if (e.role === 'push' || e.role === 'hold') zzRoleBag[e.role]++; else zzRoleBag.none++;
    }
    check('出生时真的会分到两种性格（push=' + zzRoleBag.push + ' hold=' + zzRoleBag.hold + '）',
      zzRoleBag.push > 0 && zzRoleBag.hold > 0);
    check('近战兵不参与站位性格（role=' + H.makeEnemy('melee', 0, 0).role + '）',
      H.makeEnemy('melee', 0, 0).role === null);
    check('实例甜点距离从 e.keep 起算（' + H.makeEnemy('gun', 0, 0).keep + '）',
      H.makeEnemy('gun', 0, 0).keep === EK.gun.keep);
    check('同样距离，架枪的误差小于前压的（' + H.enemyAimErr(EK.gun, 100, zzGR.hold.err).toFixed(1) + '° < '
      + H.enemyAimErr(EK.gun, 100, zzGR.push.err).toFixed(1) + '°）',
      H.enemyAimErr(EK.gun, 100, zzGR.hold.err) < H.enemyAimErr(EK.gun, 100, zzGR.push.err));
    // 架枪位不能站到自己打不到的地方（霰弹兵 78×1.22=95 会超过它的 92 射程）
    const zzHoldShot = H.makeEnemy('shotgun', 0, 0);
    zzHoldShot.role = 'hold';
    const zzHoldPush = H.makeEnemy('shotgun', 0, 0);
    zzHoldPush.role = 'push';
    check('架枪位被夹在射程内（霰弹 ' + H.gunKeepDist(zzHoldShot, EK.shotgun).toFixed(0) + 'px < 射程 '
      + EK.shotgun.attackRange + 'px，前压 ' + H.gunKeepDist(zzHoldPush, EK.shotgun).toFixed(0) + 'px）',
      H.gunKeepDist(zzHoldShot, EK.shotgun) < EK.shotgun.attackRange
      && H.gunKeepDist(zzHoldPush, EK.shotgun) < H.gunKeepDist(zzHoldShot, EK.shotgun));

    // 枪线判定：只在"队友在枪口前方、且比玩家更近、横向偏移在身体宽度内"时才算挡枪
    const zzReal = H.world.enemies;
    const zzFakeGun = { x: 0, y: 0, alive: true };
    const zzFakeMate = { x: 50, y: 0, alive: true };
    H.world.enemies = [zzFakeGun, zzFakeMate];
    check('队友正挡在枪线上 → 判定挡枪', H.allyInLine(zzFakeGun, 0, 90, 15) === zzFakeMate);
    zzFakeMate.y = 40;
    check('队友横向让开 40px → 不再挡枪', H.allyInLine(zzFakeGun, 0, 90, 15) === null);
    zzFakeMate.y = 0; zzFakeMate.x = -30;
    check('队友在枪手身后 → 不算挡枪', H.allyInLine(zzFakeGun, 0, 90, 15) === null);
    zzFakeMate.x = 120;
    check('队友比玩家还远 → 不算挡枪（子弹先到玩家）', H.allyInLine(zzFakeGun, 0, 90, 15) === null);
    zzFakeMate.x = 50; zzFakeMate.alive = false;
    check('队友已经倒了 → 不算挡枪', H.allyInLine(zzFakeGun, 0, 90, 15) === null);
    H.world.enemies = zzReal;

    // 实际行为：队友堵在枪口前，枪手不端枪、不扣子弹，而是横移让开
    H.startGame({ mode: 'challenge' });
    const zzW = H.world, zzG = H.g;
    const zzPX = zzG.player.x, zzPY = zzG.player.y;
    zzW.enemies = [];
    const zzAddGun = function (kind, x, y) {
      const ee = H.makeEnemy(kind, x, y);
      ee.state = 'chase'; ee.attackCd = 0; ee.wind = 0; ee.seeTimer = 1;
      ee.lastSeen.x = zzPX; ee.lastSeen.y = zzPY;
      ee.facing = Math.PI;
      zzW.enemies.push(ee);
      return ee;
    };
    const zzGunner = zzAddGun('gun', zzPX + 110, zzPY);
    zzGunner.role = 'hold';
    const zzMate = zzAddGun('melee', zzPX + 55, zzPY);
    const zzAmmo0 = zzGunner.ammo;
    H.step(20);                               // ≈0.33s
    check('队友挡枪线时枪手不端枪（wind=' + zzGunner.wind.toFixed(2) + 's）', zzGunner.wind <= 0.02);
    check('…也没白扣子弹（ammo ' + zzAmmo0 + ' → ' + zzGunner.ammo + '）', zzGunner.ammo === zzAmmo0);
    check('…并且往侧面让开枪线（横向离开 ' + Math.abs(zzGunner.y - zzPY).toFixed(1) + 'px）',
      Math.abs(zzGunner.y - zzPY) > 1.5);
    // 队友倒下之后，枪线空了就该补枪
    zzMate.alive = false;
    zzGunner.wind = 0; zzGunner.attackCd = 0;
    const zzAmmo1 = zzGunner.ammo;
    H.step(45);                               // ≈0.75s > 枪手前摇 0.55s
    check('枪线空了以后枪手会补枪（ammo ' + zzAmmo1 + ' → ' + zzGunner.ammo + '）', zzGunner.ammo !== zzAmmo1);

    // 敌人开门：剧情敌人不是 hunt 型，但也得会推门（否则全堵在门后）
    H.startGame({ mode: 'story' });
    const w5 = H.world;
    const d5 = w5.doors && w5.doors[0];
    if (d5) {
      const opener = w5.enemies[0];
      opener.alive = true;
      opener.hunt = false;
      opener.state = 'chase';
      opener.x = d5.x; opener.y = d5.y;
      H.step(1);
      check('警觉的敌人会自己开门（open=' + d5.open + '）', d5.open === true);
    }

    // 不堵门：四关敌人生成后都不贴着门站岗
    let minDoor = 1e9, ecnt = 0;
    for (let li = 0; li < H.storyLevels.length; li++) {
      H.startGame({ mode: 'story', storyLevel: li });
      const wl = H.world;
      for (const e of wl.enemies) {
        ecnt++;
        for (const d of (wl.doors || [])) {
          if (d.open) continue;
          minDoor = Math.min(minDoor, Math.hypot(e.x - d.x, e.y - d.y));
        }
      }
    }
    check('各关敌人生成后不贴门（' + ecnt + ' 人，最近 ' + minDoor.toFixed(0) + 'px > 20）', minDoor > 20);

    // ============ 29.6 枪械音效采样（内嵌 base64 的真实录音） ============
    // 注意：解码是异步的，这里只验证"资源在、没坏、调用不炸"；实际解码结果看
    // Sfx.sampleState（2=就绪 / 3=失败，失败会自动退回合成音）。
    const SAMP = window.SFX_SAMPLES || {};
    let totalB64 = 0, badSample = [];
    for (const nm of ['pistol', 'reload']) {
      const s = SAMP[nm] || '';
      totalB64 += s.length;
      // 手枪是 tools/synth_pistol.py 合成的 WAV（头 = RIFF），换弹仍是录音 MP3（头 = ID3）
      const want = nm === 'pistol' ? 'RIFF' : 'ID3';
      let ok = false;
      try {
        const raw = atob(s);
        ok = raw.slice(0, want.length) === want && raw.length > 15000;
      } catch (e) { ok = false; }
      if (!ok) badSample.push(nm + '(要 ' + want + ' 头)');
    }
    check('枪声 + 换弹声采样都已内嵌（' + (totalB64 / 1024).toFixed(0) + 'KB base64）', totalB64 > 40000);
    check('两个采样都完整（' + (badSample.length ? '坏：' + badSample.join(',') : 'pistol=WAV / reload=MP3，各 >15KB') + '）',
      badSample.length === 0);
    check('音效系统已挂上（ac=' + !!H.sfx.ac + '，state=' + H.sfx.sampleState + '=' + (H.sfx.sampleState === 3 ? '解码失败' : '正常/就绪') + '）',
      !!H.sfx.ac && H.sfx.sampleState !== 3);
    let shotErr = '', firstSampled = null;
    H.sfx.voices.pistol = [];   // 前面的用例已经开过枪，先清空声部记账再测"能不能真放出来"
    try {
      firstSampled = H.sfx.play('shoot');                // 第一枪：采样就绪就该走采样
      for (let i = 0; i < 6; i++) H.sfx.play('shoot');   // 连打，含解码未完成时的降级路径
      H.sfx.muted = true; H.sfx.play('shoot'); H.sfx.muted = false;
    } catch (err) { shotErr = err.message; }
    check('连打 7 枪 + 静音反复切换都不报错' + (shotErr ? '（' + shotErr + '）' : ''), shotErr === '');
    // 2026-11-08 起枪声启用合成 wav：采样可用就必须真放出来（play 返回 true 且占到一个声部）。
    const pistolReady = H.sfx.sampleReady('pistol');
    const pistolVoices = (H.sfx.voices.pistol || []).length;
    check('枪声走采样（就绪=' + pistolReady + '，首枪返回 ' + firstSampled + '，声部 ' + pistolVoices + '）',
      pistolReady ? (firstSampled === true && pistolVoices > 0) : firstSampled === false);

    // 换弹：真录音整段放完，换弹结束就不该再补合成的"咔"
    H.startGame({ mode: 'challenge' });
    const gR = H.g, pR = gR.player;
    pR.weapon = 'pistol'; pR.ammo = 2; pR.reserve = 40; pR.cooldown = 0; pR.reload = 0;
    let reloadErr = '';
    try { H.reload(); } catch (err) { reloadErr = err.message; }
    check('换弹能触发且不报错（reload=' + (pR.reload || 0).toFixed(2) + 's，用录音=' + pR.reloadSampled + '）',
      reloadErr === '' && pR.reload > 0 && typeof pR.reloadSampled === 'boolean');
    if (H.sfx.sampleReady('reload')) {
      check('采样就绪时换弹走录音（reloadSampled=' + pR.reloadSampled + '）', pR.reloadSampled === true);
      check('换弹声有 2 声部上限（' + (H.sfx.voices.reload || []).length + ' ≤ 2）',
        (H.sfx.voices.reload || []).length <= 2);
    }
    H.step(60);   // 让换弹走完，别把状态留给后面的用例

    // ============ 29.7 背景音乐（迈阿密热线风合成器摇滚） ============
    // BGM 是实时合成，无头环境音频时钟不前进，所以只断言状态机（启停/静音/强度/和弦轮转），
    // 不断言"真的出声"（那要靠人耳）。
    const zzM = H.music;
    check('音乐引擎已挂上（ctx=' + !!zzM.ctx + '，bpm=' + zzM.bpm + '）', !!zzM.ctx && zzM.bpm > 0);
    // 开局（startGame 里）就该自动起 BGM
    H.startGame({ mode: 'challenge' });
    check('开局自动起 BGM（on=' + zzM.on + '）', zzM.on === true);
    // 强度：默认交战中=1，脱战会回落（这里直接验证 setIntensity 与 target 同步）
    zzM.setIntensity(0.3);
    check('强度可调（target=' + zzM.targetIntensity.toFixed(2) + '）', Math.abs(zzM.targetIntensity - 0.3) < 0.001);
    // 静音：单独关 BGM 不碰音效开关
    const zzSfxMutedBefore = H.sfx.muted;
    zzM.setMuted(true);
    check('BGM 可单独静音（muted=' + zzM.muted + '，音效开关不受影响=' + H.sfx.muted + '）',
      zzM.muted === true && H.sfx.muted === zzSfxMutedBefore);
    zzM.setMuted(false);
    check('BGM 静音可恢复（muted=' + zzM.muted + '）', zzM.muted === false);
    // 和弦轮转：advanceBar 每小节换一次根音，BASS_PROG 首项是 0（A），推两步后应到第 3 项
    zzM.bar = 0; zzM.step = 0; zzM.advanceBar();
    const zzKey0 = zzM.bassKey;
    zzM.bar = 2; zzM.advanceBar();
    const zzKey2 = zzM.bassKey;
    check('和弦按 BASS_PROG 轮转（根音 ' + zzKey0 + ' → ' + zzKey2 + '）', zzKey0 === 0 && zzKey2 === zzM.BASS_PROG[2]);
    // 声部冒烟：手动排 4 小节（64 步），kick/snare/hat/bass/riff 全走一遍不抛异常
    let zzStepErr = '';
    try {
      const zzT0 = zzM.ctx ? zzM.ctx.currentTime + 0.1 : 0.1;
      for (let i = 0; i < 64; i++) {
        zzM.intensity = (i < 32 ? 1 : 0.2);   // 前半段拉满（riff 进），后半段回落到只剩鼓+低音
        zzM.playStep(i % 16, zzT0 + i * zzM.stepDur);
        if (i % 16 === 0) { zzM.bar = Math.floor(i / 16); zzM.advanceBar(); }
      }
    } catch (err) { zzStepErr = err.message; }
    check('连排 4 小节所有声部都不报错' + (zzStepErr ? '（' + zzStepErr + '）' : ''), zzStepErr === '');
    // 返回主菜单停 BGM
    H.goTitle();
    check('返回主菜单停 BGM（on=' + zzM.on + '）', zzM.on === false);
    // 设置页多了一个"音乐"按钮（与音效并排独立）
    const zzSB = H.settingsBtn;
    check('设置页有独立的音乐开关（music 行 y=' + zzSB.music.y + '）',
      !!zzSB.music && zzSB.music.y !== zzSB.sound.y);

    // ============ 29.8 连击倍率进度条：倍数越多衰减越快 ============
    // 连击窗口固定 2.5s，但衰减速度随 combo 增高：combo=2 正常、每多 1 连击快 18%。
    // 进度条显示剩余时间占比（comboTimer/2.5），高倍率下回退更快。
    H.startGame({ mode: 'challenge' });
    const zzCb = H.g;
    // 低倍率（combo=2）：衰减速度 = 1 + 1*0.18 = 1.18 倍
    zzCb.combo = 2; zzCb.comboTimer = 2.5;
    const zzDecay2 = 1 + (zzCb.combo - 1) * 0.18;
    // 高倍率（combo=8）：衰减速度 = 1 + 7*0.18 = 2.26 倍
    zzCb.combo = 8; zzCb.comboTimer = 2.5;
    const zzDecay8 = 1 + (zzCb.combo - 1) * 0.18;
    check('连击衰减随倍率加快（x2=' + zzDecay2.toFixed(2) + '倍速，x8=' + zzDecay8.toFixed(2) + '倍速）',
      zzDecay8 > zzDecay2 && Math.abs(zzDecay2 - 1.18) < 0.001);
    // 进度条比例：剩余时间 / 2.5，恒在 0..1 之间

    let blockedDoorAt = '', unreachableAt = '';
    for (let di = 0; di < lvls.length; di++) {
      const rows = lvls[di].rows, hh = rows.length, ww = rows[0].length;
      const isSolid = (x, y) => {
        if (x < 0 || y < 0 || x >= ww || y >= hh) return true;
        const c = rows[y][x];
        return c === '#' || c === 'o' || c === 'X';
      };
      for (let y = 0; y < hh; y++) {
        for (let x = 0; x < ww; x++) {
          if (rows[y][x] !== 'D') continue;
          for (const n of [[x - 1, y], [x + 1, y], [x, y - 1], [x, y + 1]]) {
            const c = (n[0] >= 0 && n[1] >= 0 && n[0] < ww && n[1] < hh) ? rows[n[1]][n[0]] : '#';
            if (c === 'o' || c === 'X') {
              blockedDoorAt += (blockedDoorAt ? '，' : '') + '第' + (di + 1) + '关门(' + x + ',' + y + ')前有' + c;
            }

      let sx = -1, sy = -1;
      for (let y = 0; y < hh && sx < 0; y++) {
        for (let x = 0; x < ww; x++) if (rows[y][x] === 'P') { sx = x; sy = y; break; }

          const k = n[0] + ',' + n[1];
          if (reach.has(k) || isSolid(n[0], n[1])) continue;
          reach.add(k); qq.push(n);
        }

        }
      }

    check('「恢复默认」把 W / R 都还回去（' + H.keyBinds.w + ' / ' + H.keyBinds.r + '）',
      H.keyBinds.w === 'w' && H.keyBinds.r === 'r');
    H.tap(kb.back.x + kb.back.w / 2, kb.back.y + kb.back.h / 2);
    check('键位页「返回」回到设置页（state=' + H.g.state + '）', H.g.state === 'settings');
    H.resetKeyBinds();

    report();
  }

  function isInWall(w, x, y) {
    for (const rc of w.walls) {
      if (x > rc.x && x < rc.x + rc.w && y > rc.y && y < rc.y + rc.h) return true;
    }
    return false;
  }
})();
</script>
